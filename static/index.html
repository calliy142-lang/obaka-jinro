<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>おバカ人狼 - 完全実装版</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <h1>おバカ人狼 カスタム</h1>

        <!-- ロビー画面 -->
        <div id="lobbyPanel">
            <input type="text" id="usernameInput" placeholder="プレイヤー名を入力">
            <br>
            <button onclick="handleCreateRoom()">部屋を作成する</button>
            <hr>
            <input type="text" id="roomCodeInput" placeholder="部屋コード (例: ABCD)">
            <button onclick="handleJoinRoom()">部屋に参加する</button>
        </div>

        <!-- ゲーム画面 -->
        <div id="gamePanel" style="display:none;">
            <h2>部屋コード: <span id="displayRoomCode"></span></h2>
            <div id="phaseText" style="font-weight: bold; color: #333;"></div>
            <div id="roleName" style="font-size: 1.2em; color: #007bff;"></div>
            <div id="statusText"></div>

            <!-- 結果メッセージ -->
            <div id="resultBox" style="background: #f8f9fa; border: 1px solid #ccc; padding: 10px; margin-top: 10px; display:none;"></div>

            <!-- ホスト専用設定（17役職カスタム＆昼タイマー設定） -->
            <div id="hostControls" style="display:none; border: 2px dashed #007bff; padding: 15px; margin-top: 15px;">
                <h3>ホストルーム設定（全17役職自由カスタム）</h3>
                <label>昼の制限時間（秒）: <input type="number" id="dayTimerInput" value="60" min="10" max="300"></label>
                <div style="margin-top: 10px;">
                    <h4>役職別人数配分</h4>
                    <label>バカ: <input type="number" class="role-input" data-role="fool" value="0" min="0"></label>
                    <label>ドクター: <input type="number" class="role-input" data-role="doctor" value="1" min="0"></label>
                    <label>ねずみ: <input type="number" class="role-input" data-role="mouse" value="0" min="0"></label>
                    <label>ポリス: <input type="number" class="role-input" data-role="police" value="1" min="0"></label>
                    <label>トラッパー: <input type="number" class="role-input" data-role="trapper" value="0" min="0"></label>
                    <label>ルックアウト: <input type="number" class="role-input" data-role="lookout" value="0" min="0"></label>
                    <label>インベスティゲーター: <input type="number" class="role-input" data-role="investigator" value="1" min="0"></label>
                    <label>挑発者: <input type="number" class="role-input" data-role="provoker" value="0" min="0"></label>
                    <label>トラッカー: <input type="number" class="role-input" data-role="tracker" value="0" min="0"></label>
                    <label>インポスター: <input type="number" class="role-input" data-role="imposter" value="1" min="0"></label>
                    <label>ブレイマー: <input type="number" class="role-input" data-role="blaimer" value="0" min="0"></label>
                    <label>クリーナー: <input type="number" class="role-input" data-role="cleaner" value="0" min="0"></label>
                    <label>シリアルキラー: <input type="number" class="role-input" data-role="serial_killer" value="0" min="0"></label>
                    <label>ボマー: <input type="number" class="role-input" data-role="bomber" value="0" min="0"></label>
                    <label>サバイバー: <input type="number" class="role-input" data-role="survivor" value="0" min="0"></label>
                    <label>シーフ: <input type="number" class="role-input" data-role="thief" value="0" min="0"></label>
                    <label>ゴースト: <input type="number" class="role-input" data-role="ghost" value="0" min="0"></label>
                    <label>魔術師: <input type="number" class="role-input" data-role="magician" value="0" min="0"></label>
                </div>
                <br>
                <button onclick="handleStartGame()" style="background: #28a745; color: white; padding: 10px 20px; font-size: 1em;">ゲームスタート</button>
            </div>

            <!-- アクション・投票エリア（パス選択肢対応） -->
            <div id="actionArea" style="margin-top: 20px; display:none;">
                <select id="targetSelect"></select>
                <button id="actionBtn" onclick="handleActionSubmit()">実行する</button>
            </div>
            <div id="submittedText" style="color: green; font-weight: bold; margin-top: 10px; display:none;">アクション・投票を受け付けました。他のプレイヤーを待っています...</div>
        </div>
    </div>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
