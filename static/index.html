<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feign (おバカ村)</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- セットアップ画面 -->
        <div id="setup-screen" class="card">
            <h1>Feign (おバカ村)</h1>
            <div class="form-group">
                <label>プレイヤー名</label>
                <input type="text" id="player-name-input" placeholder="名前を入力">
            </div>
            <button id="create-room-btn" class="btn btn-primary">部屋を新しく作成</button>
            <hr>
            <div class="form-group">
                <label>部屋コード</label>
                <input type="text" id="room-code-input" placeholder="部屋コードを入力">
            </div>
            <button id="join-room-btn" class="btn btn-secondary">既存の部屋に参加</button>
        </div>

        <!-- ロビー画面 -->
        <div id="lobby-screen" class="card" style="display:none;">
            <h2>ロビー (部屋コード: <span id="display-room-code"></span>)</h2>
            <p>参加メンバー:</p>
            <ul id="player-list"></ul>
            <button id="start-game-btn" class="btn btn-success" style="display:none;">ゲームを開始する</button>
        </div>

        <!-- 夜フェーズ画面 -->
        <div id="night-screen" class="card" style="display:none;">
            <h2>夜フェーズ</h2>
            <p>あなたの役職（表示）: <strong id="my-role-display"></strong></p>
            <div class="form-group">
                <label>対象を選択</label>
                <select id="action-target-select"></select>
            </div>
            <div class="form-group">
                <label>追加パラメータ (魔術師の役職予想など)</label>
                <input type="text" id="action-extra-input" placeholder="必要な場合のみ入力">
            </div>
            <button id="send-action-btn" class="btn btn-primary">行動を決定</button>
        </div>

        <!-- 昼・投票フェーズ画面 -->
        <div id="day-screen" class="card" style="display:none;">
            <h2>昼・投票フェーズ</h2>
            <div id="night-report-box" class="alert-box"></div>
            <div class="form-group">
                <label>追放するプレイヤーを選択</label>
                <select id="vote-target-select"></select>
            </div>
            <button id="send-vote-btn" class="btn btn-danger">投票する</button>
        </div>

        <!-- 結果画面 -->
        <div id="result-screen" class="card" style="display:none;">
            <h2>ゲーム結果</h2>
            <div id="game-result-text"></div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
